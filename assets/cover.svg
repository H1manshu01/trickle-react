<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="1000" height="420" fill="#0d1117"/>
  <rect x="0" y="0" width="1000" height="4" fill="#ffa657"/>

  <text x="56" y="150" font-size="54" font-weight="700" fill="#e6edf3">trickle<tspan fill="#ffa657">-react</tspan></text>
  <text x="58" y="192" font-size="18" fill="#c9d1d9">React hooks for streaming LLM objects</text>
  <text x="58" y="222" font-size="15" fill="#8b949e">typed partials · per-field loading status</text>

  <g font-size="15" fill="#c9d1d9">
    <rect x="56" y="256" width="160" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="136" y="278" text-anchor="middle">per-field status</text>
    <rect x="226" y="256" width="150" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="301" y="278" text-anchor="middle">typed partials</text>
    <rect x="386" y="256" width="92" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="432" y="278" text-anchor="middle">~1.5 kB</text>
  </g>

  <text x="58" y="344" font-size="18"><tspan fill="#ffa657">$</tspan> <tspan fill="#c9d1d9">npm install trickle-react</tspan></text>

  <rect x="512" y="56" width="432" height="308" rx="12" fill="#010409" stroke="#30363d" stroke-width="1"/>
  <rect x="512" y="56" width="432" height="38" rx="12" fill="#161b22"/>
  <rect x="512" y="82" width="432" height="12" fill="#161b22"/>
  <circle cx="534" cy="75" r="5.5" fill="#ff5f56"/>
  <circle cx="553" cy="75" r="5.5" fill="#ffbd2e"/>
  <circle cx="572" cy="75" r="5.5" fill="#27c93f"/>
  <text x="728" y="80" text-anchor="middle" font-size="12" fill="#8b949e">ProfileCard.tsx · rendering live</text>

  <text x="532" y="130" font-size="13" fill="#6e7681">// renders as the object streams in</text>
  <text x="532" y="160" font-size="14" fill="#ffa657">useStreamingObject(Profile, stream)</text>
  <text x="532" y="198" font-size="13"><tspan fill="#8b949e">data   → { </tspan><tspan fill="#79c0ff">name</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"Ada"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#79c0ff">city</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"London"</tspan><tspan fill="#8b949e"> }</tspan></text>
  <text x="532" y="228" font-size="13"><tspan fill="#8b949e">status → </tspan><tspan fill="#27c93f">name ✓</tspan><tspan fill="#8b949e">  </tspan><tspan fill="#27c93f">city ✓</tspan><tspan fill="#8b949e">  </tspan><tspan fill="#6e7681">bio …</tspan></text>
  <text x="532" y="258" font-size="13"><tspan fill="#8b949e">done   → </tspan><tspan fill="#d2a8ff">false</tspan></text>
  <text x="532" y="296" font-size="13" fill="#6e7681">// no tearing · aborts on unmount</text>
</svg>
