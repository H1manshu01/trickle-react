<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="6" fill="#ffa657"/>

  <text x="80" y="250" font-size="68" font-weight="700" fill="#e6edf3">trickle<tspan fill="#ffa657">-react</tspan></text>
  <text x="82" y="304" font-size="25" fill="#c9d1d9">React hooks for streaming LLM objects</text>
  <text x="82" y="340" font-size="19" fill="#8b949e">typed partials · per-field loading status</text>

  <g font-size="18" fill="#c9d1d9">
    <rect x="80" y="376" width="204" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="182" y="404" text-anchor="middle">per-field status</text>
    <rect x="296" y="376" width="186" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="389" y="404" text-anchor="middle">typed partials</text>
    <rect x="494" y="376" width="118" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="553" y="404" text-anchor="middle">~1.5 kB</text>
  </g>

  <text x="82" y="508" font-size="25"><tspan fill="#ffa657">$</tspan> <tspan fill="#c9d1d9">npm install trickle-react</tspan></text>

  <rect x="700" y="96" width="500" height="448" rx="14" fill="#010409" stroke="#30363d" stroke-width="1"/>
  <rect x="700" y="96" width="500" height="46" rx="14" fill="#161b22"/>
  <rect x="700" y="128" width="500" height="14" fill="#161b22"/>
  <circle cx="726" cy="119" r="6.5" fill="#ff5f56"/>
  <circle cx="748" cy="119" r="6.5" fill="#ffbd2e"/>
  <circle cx="770" cy="119" r="6.5" fill="#27c93f"/>
  <text x="975" y="124" text-anchor="middle" font-size="14" fill="#8b949e">ProfileCard.tsx · rendering live</text>

  <text x="724" y="192" font-size="15" fill="#6e7681">// renders as the object streams in</text>
  <text x="724" y="226" font-size="17" fill="#ffa657">useStreamingObject(Profile, stream)</text>
  <text x="724" y="272" font-size="15"><tspan fill="#8b949e">data   → { </tspan><tspan fill="#79c0ff">name</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"Ada"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#79c0ff">city</tspan><tspan fill="#8b949e">: …}</tspan></text>
  <text x="724" y="308" font-size="15"><tspan fill="#8b949e">status → </tspan><tspan fill="#27c93f">name ✓</tspan><tspan fill="#8b949e">  </tspan><tspan fill="#27c93f">city ✓</tspan><tspan fill="#8b949e">  </tspan><tspan fill="#6e7681">bio …</tspan></text>
  <text x="724" y="344" font-size="15"><tspan fill="#8b949e">done   → </tspan><tspan fill="#d2a8ff">false</tspan></text>
  <text x="724" y="392" font-size="15" fill="#6e7681">// no tearing · aborts on unmount</text>
</svg>
